[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dayanak"
version = "1.0.0"
description = "Answers from your documents: every sentence cited and checked. Turkish-first RAG with hallucination guard."
readme = "README.md"
license = "MIT"
authors = [{ name = "Numan AK" }]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "httpx>=0.27",
  "openai>=1.40",
  "pydantic>=2.6",
  "pypdf>=4.0",
  "python-docx>=1.1",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
dayanak = "dayanak.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dayanak"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Query"]

[tool.ruff.lint]
ignore = ["SIM905"]
